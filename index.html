<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A calm, configurable Markdown reader." />
    <title>Markdown Vision</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="toolbar">
        <button class="icon-button" id="openButton" type="button" title="Open Markdown file" aria-label="Open Markdown file">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 6.75a2 2 0 0 1 2-2h4l2 2h6.5a2 2 0 0 1 2 2v1.5H8.4a2 2 0 0 0-1.9 1.37L4 19.12a2 2 0 0 1-.25-.97V6.75Z"/><path d="M8.4 10.25h12.35l-2.43 7.3a2 2 0 0 1-1.9 1.37H4l2.5-7.3a2 2 0 0 1 1.9-1.37Z"/></svg>
        </button>
        <input id="fileInput" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain" hidden />

        <button class="icon-button" id="settingsButton" type="button" title="Reading settings" aria-label="Reading settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l2-1.55-2-3.46-2.48 1a8 8 0 0 0-2.6-1.5L14 2.33h-4L9.68 5a8 8 0 0 0-2.6 1.5l-2.48-1-2 3.46 2 1.55a7.8 7.8 0 0 0 0 3l-2 1.55 2 3.46 2.48-1a8 8 0 0 0 2.6 1.5l.32 2.67h4l.32-2.67a8 8 0 0 0 2.6-1.5l2.48 1 2-3.46-2-1.55Z"/></svg>
        </button>

        <button class="theme-button" id="themeButton" type="button" aria-label="Switch to dark mode">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8 8 0 0 1 9.4 3.5 8.5 8.5 0 1 0 20.5 14.6Z"/></svg>
        </button>
        <button class="text-button" id="pasteButton" type="button">Paste Markdown</button>
      </div>

      <aside class="settings" id="settingsPanel" aria-label="Reading settings" hidden>
        <div class="settings-heading">
          <strong>Reading settings</strong>
          <button class="close-button" id="closeSettings" type="button" aria-label="Close settings">x</button>
        </div>
        <label for="fontInput">System font</label>
        <input id="fontInput" type="text" list="systemFonts" autocomplete="off" placeholder="Enter any installed font" />
        <datalist id="systemFonts"></datalist>
        <div class="font-status" id="fontStatus">Type a font name or choose an installed font.</div>
        <label for="fontSize">Text size <output id="fontSizeOutput">18px</output></label>
        <input id="fontSize" type="range" min="14" max="26" step="1" value="18" />
        <label for="lineHeight">Line spacing <output id="lineHeightOutput">1.75</output></label>
        <input id="lineHeight" type="range" min="1.35" max="2.1" step="0.05" value="1.75" />
        <label for="readingWidth">Page width <output id="readingWidthOutput">720px</output></label>
        <input id="readingWidth" type="range" min="540" max="920" step="20" value="720" />
      </aside>
    </header>

    <main>
      <section class="reader-shell" id="readerShell" hidden>
        <div class="document-meta">
          <span id="fileName">Untitled.md</span>
        </div>
        <article class="markdown-body" id="markdownOutput"></article>
      </section>

      <dialog id="pasteDialog">
        <form method="dialog">
          <div class="dialog-heading">
            <div>
              <span class="eyebrow">New document</span>
              <h2>Paste Markdown</h2>
            </div>
            <button class="close-button" value="cancel" aria-label="Close">x</button>
          </div>
          <textarea id="markdownInput" placeholder="# Start with a heading..." spellcheck="true"></textarea>
          <div class="dialog-actions">
            <button class="text-button" value="cancel">Cancel</button>
            <button class="primary-button" id="renderButton" value="default">Read document</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="app.js"></script>
  </body>
</html>
