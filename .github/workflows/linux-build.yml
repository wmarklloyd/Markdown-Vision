name: Ubuntu package validation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach these packages to
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/linux-build.yml'
      - '.github/workflows/fedora-build.yml'
      - 'src/web/**'
      - 'tests/fixtures/**'
      - 'native-tauri/**'
      - 'tools/stage-tauri.cjs'
      - 'docs/linux-release-targets.json'
      - 'tools/check-linux-lifecycle.sh'
      - 'tools/check-linux-package.sh'
      - 'tools/check-linux-appimage-launch.sh'
      - 'tools/check-linux-release-map.cjs'
      - 'tools/check-cross-platform-metadata.cjs'
      - 'tools/test-tauri-open-queue.cjs'
  push:
    branches:
      - codex/linux-matrix-build
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            deb_architecture: amd64
            appimage: true
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            deb_architecture: arm64
            appimage: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          app_version=$(node -p "require('./native-tauri/tauri.conf.json').version")
          test "$tag_version" = "$app_version"
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          set -eu
          actual=$(uname -m)
          test "$actual" = "$EXPECTED_ARCH"
      - name: Install Ubuntu build and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config rpm libfuse2t64 xvfb xauth dbus-x11 xdotool zenity xdg-utils imagemagick xclip tesseract-ocr python3-xlib
      - name: Install Tauri CLI
        run: npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock @tauri-apps/cli@2.12.6
      - name: Test native services
        run: |
          node tools/stage-tauri.cjs
          cargo test --locked --manifest-path native-tauri/Cargo.toml
          node tools/test-tauri-open-queue.cjs
          node tools/check-cross-platform-metadata.cjs
          node tools/check-linux-release-map.cjs --distribution ubuntu --architecture "${{ matrix.architecture }}"
      - name: Record Ubuntu runner and WebKitGTK versions
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          mkdir -p "$RUNNER_TEMP/linux-evidence"
          cat /etc/os-release | tee "$RUNNER_TEMP/linux-evidence/os-release.txt"
          uname -a | tee "$RUNNER_TEMP/linux-evidence/uname.txt"
          rustc --version --verbose | tee "$RUNNER_TEMP/linux-evidence/rustc-version.txt"
          cargo --version | tee "$RUNNER_TEMP/linux-evidence/cargo-version.txt"
          rustup target list --installed | tee "$RUNNER_TEMP/linux-evidence/rust-targets.txt"
          node --version | tee "$RUNNER_TEMP/linux-evidence/node-version.txt"
          npm --version | tee "$RUNNER_TEMP/linux-evidence/npm-version.txt"
          "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" --version | tee "$RUNNER_TEMP/linux-evidence/tauri-cli-version.txt"
          pkg-config --modversion webkit2gtk-4.1 | tee "$RUNNER_TEMP/linux-evidence/webkitgtk-version.txt"
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
            libwebkit2gtk-4.1-0 libgtk-3-0 zenity xdg-utils | tee "$RUNNER_TEMP/linux-evidence/runtime-packages.txt"
      - name: Select Ubuntu package targets
        id: linux-targets
        env:
          LINUX_ARCH: ${{ matrix.architecture }}
        run: echo "bundles=$(node tools/check-linux-release-map.cjs --distribution ubuntu --architecture "$LINUX_ARCH" --bundles)" >> "$GITHUB_OUTPUT"
      - name: Build Ubuntu packages
        working-directory: native-tauri
        run: '"$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" build --bundles "${{ steps.linux-targets.outputs.bundles }}" -- --locked'
      - name: Inspect Ubuntu packages and write checksums
        env:
          LINUX_ARCH: ${{ matrix.architecture }}
          DEB_ARCH: ${{ matrix.deb_architecture }}
        run: |
          set -eu
          deb=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          node tools/check-linux-release-map.cjs --distribution ubuntu --architecture "$LINUX_ARCH" --verify-outputs --manifest "$RUNNER_TEMP/linux-evidence/linux-release-manifest.json"
          expected_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' native-tauri/Cargo.toml | head -n 1)
          test -n "$expected_version"
          dpkg-deb --info "$deb"
          sh tools/check-linux-package.sh "$deb" "$expected_version" "$DEB_ARCH"
          file "$deb"
          stat -c '%n %s bytes' "$deb" | tee "$RUNNER_TEMP/linux-evidence/package-sizes.txt"
          sha256sum "$deb" | tee "$RUNNER_TEMP/linux-evidence/package-sha256.txt"
          if [ "$LINUX_ARCH" = x86_64 ]; then
            appimage=$(find native-tauri/target/release/bundle/appimage -maxdepth 1 -iname '*.appimage' -print -quit)
            test -n "$appimage"
            file "$appimage"
            stat -c '%n %s bytes' "$appimage" | tee -a "$RUNNER_TEMP/linux-evidence/package-sizes.txt"
            sha256sum "$appimage" | tee -a "$RUNNER_TEMP/linux-evidence/package-sha256.txt"
          fi
      - name: Install packaged Ubuntu application
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.deb_architecture }}
        run: |
          set -eu
          package=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          expected_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' native-tauri/Cargo.toml | head -n 1)
          sudo apt-get install -y "./$package"
          installed=$(dpkg-query --show --showformat='${Status} ${Version} ${Architecture}' markdown-vision)
          test "$installed" = "install ok installed $expected_version $EXPECTED_DEB_ARCH"
      - name: Verify package dependencies on Ubuntu 26.10
        if: matrix.architecture == 'x86_64'
        run: |
          set -eu
          package=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          docker run --rm -v "$GITHUB_WORKSPACE/$package:/tmp/markdown-vision.deb:ro" ubuntu:26.10 sh -c \
            'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/markdown-vision.deb && dpkg-query -W markdown-vision'
      - name: Exercise installed application in a virtual desktop
        run: |
          set -eu
          xvfb-run -a dbus-run-session -- sh tools/check-linux-lifecycle.sh \
            /usr/bin/markdown-vision tests/fixtures/Markdown-total-torture-test.md "$RUNNER_TEMP/linux-evidence"
          file "$RUNNER_TEMP/linux-evidence/linux-print.pdf"
          sha256sum "$RUNNER_TEMP/linux-evidence/linux-print.pdf"
      - name: Launch AppImage in a virtual desktop
        if: matrix.appimage
        run: |
          set -eu
          appimage=$(find native-tauri/target/release/bundle/appimage -maxdepth 1 -iname '*.appimage' -print -quit)
          xvfb-run -a dbus-run-session -- sh tools/check-linux-appimage-launch.sh \
            "$appimage" tests/fixtures/Markdown-total-torture-test.md "$RUNNER_TEMP/linux-evidence/appimage-launch.log"
      - name: Retain Ubuntu packages and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-vision-ubuntu-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            native-tauri/target/release/bundle/deb/*.deb
            native-tauri/target/release/bundle/appimage/*.AppImage
            ${{ runner.temp }}/linux-evidence/
          if-no-files-found: warn
      - name: Attach Ubuntu packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' || github.ref == 'refs/heads/codex/linux-matrix-build'
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_ARCH: ${{ matrix.architecture }}
        run: |
          set -eu
          if [ "$GITHUB_REF" = "refs/tags/${GITHUB_REF_NAME}" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' native-tauri/Cargo.toml | head -n 1)
            release_tag="v$version"
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              echo "No GitHub Release exists for $release_tag; retaining the package as a workflow artifact."
              exit 0
            fi
          fi
          version=${release_tag#v}
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          deb=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          cp "$deb" "$assets/Markdown-Vision-${version}-ubuntu-${LINUX_ARCH}.deb"
          if [ "$LINUX_ARCH" = x86_64 ]; then
            appimage=$(find native-tauri/target/release/bundle/appimage -maxdepth 1 -iname '*.appimage' -print -quit)
            cp "$appimage" "$assets/Markdown-Vision-${version}-ubuntu-${LINUX_ARCH}.AppImage"
          fi
          gh release upload "$release_tag" "$assets"/* --clobber
