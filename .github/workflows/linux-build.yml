name: Linux development build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/linux-build-check

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config xvfb xauth dbus-x11 xdotool zenity imagemagick
      - name: Install Tauri CLI
        run: npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock @tauri-apps/cli@2.12.6
      - name: Test native services
        run: |
          node tools/stage-tauri.cjs
          cargo test --locked --manifest-path native-tauri/Cargo.toml
          node tools/test-tauri-open-queue.cjs
      - name: Build Linux Debian package
        working-directory: native-tauri
        run: '"$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" build --bundles deb -- --locked'
      - name: Inspect Debian package
        run: |
          set -eu
          package=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
      - name: Launch packaged application
        run: |
          set -eu
          package=$(find native-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --extract "$package" "$RUNNER_TEMP/markdown-vision-package"
          test -x "$RUNNER_TEMP/markdown-vision-package/usr/bin/markdown-vision"
          xvfb-run -a dbus-run-session -- sh -c '
            "$1" >"$2" 2>&1 &
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$2"
              wait "$pid"
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
          ' sh "$RUNNER_TEMP/markdown-vision-package/usr/bin/markdown-vision" "$RUNNER_TEMP/markdown-vision-launch.log"
      - name: Check Linux file-open lifecycle
        run: |
          set -eu
          xvfb-run -a dbus-run-session -- sh tools/check-linux-lifecycle.sh "$RUNNER_TEMP/markdown-vision-package/usr/bin/markdown-vision" "$GITHUB_WORKSPACE/Markdown-total-torture-test.md" "$RUNNER_TEMP/lifecycle-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-lifecycle-evidence
          path: ${{ runner.temp }}/lifecycle-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-vision-linux-development-deb
          path: native-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
