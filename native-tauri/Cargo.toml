[package]
name = "markdown-vision"
version = "2.8.17"
edition = "2021"

[workspace]
members = [".", "webview-reference"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
percent-encoding = "2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
