[package]
name = "markdown-vision"
version = "2.8.12"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
percent-encoding = "2"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
